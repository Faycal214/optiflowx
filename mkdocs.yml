site_name: StochX
site_description: A Python library for stochastic-process mathematics and time-series analysis.
repo_url: https://github.com/Faycal214/stochx
repo_name: Faycal214/stochx

nav:
  - Home: index.md
  - Course Material:
      - Overview: course_material.md
      - Chapter 1 — Discrete-Time Markov Chains: course_chapitre1.md
      - Chapter 2 — Poisson Processes: course_chapitre2.md
      - Chapter 3 — Continuous-Time Markov Chains: course_chapitre3.md
      - Chapter 4 — Conditional Expectation: course_chapitre4.md
      - Chapter 5 — Discrete-Time Martingales: course_chapitre5.md
  - Package / API:
      - Course → API Map: course-map.md
      - Architecture: architecture.md
      - Time Series: time_series.md
      - Stage 10 — State-Space Core: stage10/10.2_state_space_kalman.md
      - Stage 11 — State-Space Extension:
          - Contract: stage11/11.1_contract.md
          - Forecasting: stage11/11.2_state_space_forecasting.md
          - Likelihood Estimation: stage11/11.3_likelihood_estimation.md
          - Full Workflow: stage11/11.7_full_state_space_workflow.md
          - Final Regression Gate: stage11/11.9_final_regression_gate.md
          - Freeze: stage11/11.10_stage_freeze.md
      - API Reference:
          - Overview: api/index.md
          - MarkovChain: api/markov_chain.md
          - PoissonProcess: api/poisson_process.md
          - NonHomogeneousPoissonProcess: api/non_homogeneous_poisson_process.md
          - ContinuousTimeMarkovChain: api/continuous_time_markov_chain.md
          - CTMCPath: api/ctmc_path.md
          - BirthDeathProcess: api/birth_death_process.md
          - FiniteProbabilitySpace: api/finite_probability_space.md
          - RandomVariable: api/random_variable.md
          - Partition: api/partition.md
          - Filtration: api/filtration.md
          - Martingale: api/martingale.md
          - StoppingTime: api/stopping_time.md
          - StoppedProcess: api/stopped_process.md
          - Analysis Utilities: api/analysis.md
          - Exceptions: api/exceptions.md
      - API Map: api.md
  - Examples:
      - Worked Examples: examples.md
  - Release:
      - Stage 12.1 — Release Readiness: stage12/12.1_release_readiness.md
      - Stage 12.2 — Distribution Hardening: stage12/12.2_distribution_hardening.md
      - Stage 12.3 — Release Surface Closure: stage12/12.3_release_surface_closure.md
  - About: about.md

theme:
  name: readthedocs
  locale: en
  sticky_navigation: true
  navigation_depth: 4
  collapse_navigation: false
  titles_only: false
  include_search_page: true
  prev_next_buttons_location: bottom

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
