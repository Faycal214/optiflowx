site_name: OptiFlowX
site_description: Executable stochastic-process course material based on the five USTHB MSPRO stochastic-process PDFs.
repo_url: https://github.com/Faycal214/optiflowx
repo_name: Faycal214/optiflowx

nav:
  - Home: index.md
  - Course Material:
      - Overview: course_material.md
      - Chapter 1 — Discrete-Time Markov Chains: course_chapitre1.md
      - Chapter 2 — Poisson Processes: course_chapitre2.md
      - Chapter 3 — Continuous-Time Markov Chains: course_chapitre3.md
      - Chapter 4 — Conditional Expectation: course_chapitre4.md
      - Chapter 5 — Discrete-Time Martingales: course_chapitre5.md
  - Package / API:
      - Course → API Map: course-map.md
      - Architecture: architecture.md
      - API Reference:
          - Overview: api/index.md
          - MarkovChain: api/markov_chain.md
          - PoissonProcess: api/poisson_process.md
          - ContinuousTimeMarkovChain: api/continuous_time_markov_chain.md
          - BirthDeathProcess: api/birth_death_process.md
          - FiniteProbabilitySpace: api/probability_space.md
          - RandomVariable: api/random_variable.md
          - Partition: api/partition.md
          - Filtration: api/filtration.md
          - Martingale: api/martingale.md
          - StoppingTime: api/stopping_time.md
          - StoppedProcess: api/stopped_process.md
          - Analysis Utilities: api/analysis.md
          - Exceptions: api/exceptions.md
      - API Map: api.md
  - Examples:
      - Worked Examples: examples.md

theme:
  name: readthedocs
  locale: en
  sticky_navigation: true
  navigation_depth: 4
  collapse_navigation: false
  titles_only: false
  include_search_page: true
  prev_next_buttons_location: bottom

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
