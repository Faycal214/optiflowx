site_name: OptiFlowX
site_url: https://faycal214.github.io/optiflowx/
repo_url: https://github.com/Faycal214/optiflowx
theme:
  name: material
  custom_dir: docs/overrides
  features:
    - navigation.expand
    - navigation.sections
    - navigation.instant
    - toc.follow
    - search.highlight
    - content.code.copy
    - toc.integrate
  # Light / Dark / Custom palettes and auto-detection
  palette:
    # Dark-first: slate listed first to load dark by default
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Expose custom scheme if needed
    - scheme: custom
      primary: custom
      accent: custom

  # Typography (fonts) — use Inter for text and JetBrains Mono for code
  font:
    text: "Inter"
    code: "JetBrains Mono"
  language: en

# Extra javascript for small UX improvements (smooth scrolling, TOC highlight)
extra_javascript:
  - assets/javascripts/smooth-scroll.js
  - javascripts/extra.js

  # Allow Material to include our custom palette override
extra_css:
  - overrides/assets/stylesheets/theme.css
  - assets/stylesheets/custom-theme.css
  - stylesheets/extra.css
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Examples:
    - Basic Examples: examples.md
    - Custom Metric Examples: examples_custom_metric.md
  - API Reference: api.md
  - Algorithms: algorithms.md
  - Contributing: contributing.md
  - Design System: design-system.md
  - Developer Docs: docs/index.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python: {}
