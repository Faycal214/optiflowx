name: Release Candidate

on:
  push:
    branches:
      - "release/0.3.0-rc1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify candidate commit is contained in main
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Verify candidate version
        run: python -c "import stochx; assert stochx.__version__ == '0.3.0rc1'"

      - name: Run full test suite
        run: pytest -q tests --disable-warnings

  examples-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify candidate commit is contained in main
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and documentation tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install mkdocs mkdocs-material pytest build twine

      - name: Verify candidate version
        run: python -c "import stochx; assert stochx.__version__ == '0.3.0rc1'"

      - name: Run every executable example
        run: |
          for example in examples/*.py; do python "$example" >/dev/null; done

      - name: Build strict documentation
        run: mkdocs build --strict

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Verify built artifact version
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          expected = "0.3.0rc1"
          artifacts = list(Path("dist").iterdir())
          assert len(artifacts) == 2, artifacts
          assert any(p.suffix == ".whl" and expected in p.name for p in artifacts)
          assert any(p.suffix == ".gz" and expected in p.name for p in artifacts)
          for path in artifacts:
              if path.suffix == ".whl":
                  with zipfile.ZipFile(path) as archive:
                      metadata = [n for n in archive.namelist() if n.endswith(".dist-info/METADATA")][0]
                      text = archive.read(metadata).decode()
                      assert "Version: 0.3.0rc1" in text
              else:
                  with tarfile.open(path, "r:gz") as archive:
                      members = archive.getnames()
                      assert any("PKG-INFO" in name and "0.3.0rc1" in name for name in members)
          PY

      - name: Generate SHA-256 manifest
        run: sha256sum dist/* | sort > dist/SHA256SUMS.txt

      - name: Upload immutable candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stochx-0.3.0rc1-candidate
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          retention-days: 90
