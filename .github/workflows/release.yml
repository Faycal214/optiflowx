name: Release package

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install build twine pytest

      - name: Run stochastic tests
        run: pytest -q tests/test_stochastic_*.py --disable-warnings

      - name: Run release-surface coverage
        run: |
          pytest -q \
            tests/test_docstring_coverage.py \
            tests/test_stochastic_example_coverage.py \
            tests/test_api_documentation_coverage.py \
            tests/test_documentation_coverage.py

      - name: Run every executable example
        run: |
          for example in examples/*.py; do python "$example" >/dev/null; done

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Create v0.1.0 tag after successful verification
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release v0.1.0]')
        run: |
          VERSION=$(python -c "import optiflowx; print(optiflowx.__version__)")
          test "$VERSION" = "0.1.0"
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists; nothing to create."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "OptiFlowX v${VERSION}"
          git push origin "v${VERSION}"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: optiflowx-distributions
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/optiflowx/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: optiflowx-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
