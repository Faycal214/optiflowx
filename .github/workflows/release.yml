name: Release package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install build twine mkdocs mkdocs-material pytest

      - name: Verify tag points to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(python -c 'import stochx; print(stochx.__version__)')"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

      - name: Run complete test suite
        run: pytest -q tests --disable-warnings

      - name: Run API, documentation, example, and identity coverage
        run: |
          pytest -q \
            tests/test_docstring_coverage.py \
            tests/test_stochastic_example_coverage.py \
            tests/test_api_documentation_coverage.py \
            tests/test_documentation_coverage.py \
            tests/test_package_identity.py \
            --disable-warnings

      - name: Run every executable example
        run: |
          for example in examples/*.py; do python "$example" >/dev/null; done

      - name: Build strict documentation
        run: mkdocs build --strict

      - name: Build distributions
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Verify wheel installation in a clean environment
        run: |
          python -m venv /tmp/stochx-release-venv
          /tmp/stochx-release-venv/bin/python -m pip install --upgrade pip
          /tmp/stochx-release-venv/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/stochx-release-venv/bin/python -c 'import stochx, stochx.stochastic, stochx.timeseries; print(stochx.__version__)'

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: stochx-distributions
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/stochx/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: stochx-distributions
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
