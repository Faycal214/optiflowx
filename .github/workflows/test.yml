name: Stochastic Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install stochastic runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install numpy scipy pytest
      - name: Run stochastic tests
        run: |
          pytest -q tests/test_stochastic_*.py --disable-warnings

  examples-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: One-off Markov ergodic regression migration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/test.yml')
          source = Path('optiflowx/stochastic/markov_chain.py')
          text = source.read_text()
          old = '''        for start in range(n):\n            seen = {start}\n            queue = [start]\n            while queue:\n                vertex = queue.pop()\n                for neighbour in graph[vertex]:\n                    if neighbour not in seen:\n                        seen.add(neighbour)\n            if len(seen) != n:\n                return False\n'''
          new = '''        for start in range(n):\n            seen = {start}\n            queue = [start]\n            while queue:\n                vertex = queue.pop()\n                for neighbour in graph[vertex]:\n                    if neighbour not in seen:\n                        seen.add(neighbour)\n                        queue.append(neighbour)\n            if len(seen) != n:\n                return False\n'''
          if old in text:
              source.write_text(text.replace(old, new, 1))
          else:
              print('Markov traversal already restored; continuing with regression guard.')

          regression = Path('tests/test_stochastic_markov_limiting.py')
          regression.write_text('''import numpy as np\n\nfrom optiflowx.stochastic import MarkovChain\n\n\ndef test_limiting_distribution_single_closed_three_state_class():\n    chain = MarkovChain(\n        [\n            [0.5, 0.5, 0.0, 0.0],\n            [0.0, 0.5, 0.5, 0.0],\n            [0.0, 0.0, 0.5, 0.5],\n            [0.0, 0.5, 0.0, 0.5],\n        ],\n        states=["T", "A", "B", "C"],\n    )\n\n    expected = np.tile([0.0, 1 / 3, 1 / 3, 1 / 3], (4, 1))\n    np.testing.assert_allclose(chain.limiting_distribution(), expected)\n''')

          text = workflow.read_text()
          marker_start = '      - name: One-off Markov ergodic regression migration\n'
          start = text.index(marker_start)
          end = text.index('      - name: Build mathematical documentation\n', start)
          replacement = '      - name: Build mathematical documentation\n'
          workflow.write_text(text[:start] + replacement + text[end + len(replacement):])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add optiflowx/stochastic/markov_chain.py tests/test_stochastic_markov_limiting.py .github/workflows/test.yml
          git commit -m "fix: restore Markov ergodic traversal and add regression" || exit 0
          git push origin HEAD:main
      - name: Install package and documentation tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install mkdocs mkdocs-material
      - name: Run worked examples
        run: |
          for example in examples/*.py; do python "$example" >/dev/null; done
      - name: Build mathematical documentation
        run: mkdocs build --strict
