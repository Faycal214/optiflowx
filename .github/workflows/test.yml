name: Stochastic Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run full test suite
        run: |
          pytest -q tests --disable-warnings
      - name: Run API, documentation, example, and identity coverage
        run: |
          pytest -q \
            tests/test_docstring_coverage.py \
            tests/test_stochastic_example_coverage.py \
            tests/test_api_documentation_coverage.py \
            tests/test_documentation_coverage.py \
            tests/test_package_identity.py \
            --disable-warnings

  examples-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package, test, and documentation tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install mkdocs mkdocs-material pytest
      - name: Run worked examples
        run: |
          for example in examples/*.py; do python "$example" >/dev/null; done
      - name: Verify documentation, example, and identity coverage
        run: |
          pytest -q \
            tests/test_api_documentation_coverage.py \
            tests/test_documentation_coverage.py \
            tests/test_stochastic_example_coverage.py \
            tests/test_docstring_coverage.py \
            tests/test_package_identity.py \
            --disable-warnings
      - name: Build mathematical documentation
        run: mkdocs build --strict
      - name: Build package distributions
        run: |
          pip install build twine
          python -m build
          python -m twine check dist/*
