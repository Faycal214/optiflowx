name: Stochastic Test Suite

on:
  push:
    branches: [ stoch-process-foundation ]
  pull_request:
    branches: [ main, stoch-process-foundation ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install stochastic runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install numpy scipy pytest
      - name: Run stochastic tests
        run: |
          pytest -q tests/test_stochastic_*.py --disable-warnings
