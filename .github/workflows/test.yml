name: Stochastic Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install stochastic runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install numpy scipy pytest
      - name: Run stochastic tests
        run: |
          pytest -q tests/test_stochastic_*.py --disable-warnings
      - name: Run API, documentation, and example coverage
        run: |
          pytest -q \
            tests/test_docstring_coverage.py \
            tests/test_stochastic_example_coverage.py \
            tests/test_api_documentation_coverage.py \
            tests/test_documentation_coverage.py \
            --disable-warnings

  examples-and-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and documentation tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install mkdocs mkdocs-material pytest
      - name: Run worked examples
        run: |
          for example in examples/*.py; do python "$example" >/dev/null; done
      - name: Verify documentation and example coverage
        run: |
          pytest -q \
            tests/test_api_documentation_coverage.py \
            tests/test_documentation_coverage.py \
            tests/test_stochastic_example_coverage.py \
            tests/test_docstring_coverage.py \
            --disable-warnings
      - name: Build mathematical documentation
        run: mkdocs build --strict
