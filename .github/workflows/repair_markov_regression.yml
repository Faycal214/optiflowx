name: Repair Markov ergodic traversal

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/repair_markov_regression.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch helper and add regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("optiflowx/stochastic/markov_chain.py")
          text = path.read_text()
          old = '''        for start in range(n):
            seen = {start}
            queue = [start]
            while queue:
                vertex = queue.pop()
                for neighbour in graph[vertex]:
                    if neighbour not in seen:
                        seen.add(neighbour)
            if len(seen) != n:
                return False
'''
          new = '''        for start in range(n):
            seen = {start}
            queue = [start]
            while queue:
                vertex = queue.pop()
                for neighbour in graph[vertex]:
                    if neighbour not in seen:
                        seen.add(neighbour)
                        queue.append(neighbour)
            if len(seen) != n:
                return False
'''
          if old not in text:
              raise SystemExit("expected _matrix_ergodic traversal block was not found")
          path.write_text(text.replace(old, new, 1))

          test = Path("tests/test_stochastic_markov_limiting.py")
          test.write_text('''import numpy as np\n\nfrom optiflowx.stochastic import MarkovChain\n\n\ndef test_limiting_distribution_single_closed_three_state_class():\n    chain = MarkovChain(\n        [\n            [0.5, 0.5, 0.0, 0.0],\n            [0.0, 0.5, 0.5, 0.0],\n            [0.0, 0.0, 0.5, 0.5],\n            [0.0, 0.5, 0.0, 0.5],\n        ],\n        states=["T", "A", "B", "C"],\n    )\n\n    expected = np.tile([0.0, 1 / 3, 1 / 3, 1 / 3], (4, 1))\n    np.testing.assert_allclose(chain.limiting_distribution(), expected)\n''')
          PY

      - name: Run focused regression
        run: |
          python -m pip install -e . --no-deps
          python -m pip install numpy scipy pytest
          pytest -q tests/test_stochastic_markov.py tests/test_stochastic_markov_limiting.py

      - name: Commit migration and remove one-off workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add optiflowx/stochastic/markov_chain.py tests/test_stochastic_markov_limiting.py .github/workflows/repair_markov_regression.yml
          git rm .github/workflows/repair_markov_regression.yml
          git commit -m "fix: restore Markov ergodic traversal"
          git push origin HEAD:main
