name: Refactor Markov validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Apply MarkovChain validation refactor
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("optiflowx/stochastic/markov_chain.py")
          text = path.read_text()

          old_import = "import numpy as np\n\nState = Hashable\n"
          new_import = (
              "import numpy as np\n\n"
              "from .validation import validate_states, validate_stochastic_matrix, validate_tolerance\n\n"
              "State = Hashable\n"
          )
          if old_import not in text and "from .validation import validate_states" not in text:
              raise SystemExit("expected import block not found")
          if old_import in text:
              text = text.replace(old_import, new_import, 1)

          old_init = '''    def __init__(self, transition_matrix: Sequence[Sequence[float]], states: Sequence[State] | None = None, *, tolerance: float = 1e-12) -> None:\n        matrix = np.asarray(transition_matrix, dtype=float)\n        if matrix.ndim != 2 or matrix.shape[0] != matrix.shape[1] or matrix.shape[0] == 0:\n            raise ValueError("transition_matrix must be a non-empty square matrix")\n        if not np.all(np.isfinite(matrix)):\n            raise ValueError("transition_matrix must contain finite values")\n        if np.any(matrix < -tolerance) or not np.allclose(matrix.sum(axis=1), 1.0, atol=tolerance, rtol=0.0):\n            raise ValueError("transition_matrix must be stochastic: non-negative rows summing to 1")\n        matrix = matrix.copy()\n        matrix[np.abs(matrix) < tolerance] = 0.0\n        matrix[matrix < 0.0] = 0.0\n        labels = tuple(range(matrix.shape[0])) if states is None else tuple(states)\n        if len(labels) != matrix.shape[0] or len(set(labels)) != len(labels):\n            raise ValueError("states must be unique and match matrix size")\n        self._P = matrix\n        self._states = labels\n        self._index = {state: i for i, state in enumerate(labels)}\n        self._tolerance = float(tolerance)\n'''
          new_init = '''    def __init__(self, transition_matrix: Sequence[Sequence[float]], states: Sequence[State] | None = None, *, tolerance: float = 1e-12) -> None:\n        tolerance = validate_tolerance(tolerance)\n        matrix = validate_stochastic_matrix(transition_matrix, tolerance=tolerance)\n        labels = validate_states(states, matrix.shape[0])\n        self._P = matrix\n        self._states = labels\n        self._index = {state: i for i, state in enumerate(labels)}\n        self._tolerance = tolerance\n'''
          if old_init in text:
              text = text.replace(old_init, new_init, 1)
          elif "matrix = validate_stochastic_matrix" not in text:
              raise SystemExit("expected constructor block not found")
          path.write_text(text)
          PY
      - name: Add focused regression tests
        run: |
          cat > tests/test_markov_chain_validation.py <<'PY'
          import numpy as np
          import pytest

          from optiflowx.stochastic import MarkovChain
          from optiflowx.stochastic.exceptions import MatrixValidationError


          def test_markov_chain_rejects_non_stochastic_matrix_with_semantic_error():
              with pytest.raises(MatrixValidationError):
                  MarkovChain([[0.8, 0.3], [0.2, 0.8]])


          def test_markov_chain_rejects_negative_probability_beyond_tolerance():
              with pytest.raises(MatrixValidationError):
                  MarkovChain([[1.0 + 2e-12, -2e-12], [0.0, 1.0]])


          def test_markov_chain_normalizes_row_sum_drift_on_construction():
              chain = MarkovChain(
                  [[0.5, 0.5000000000005], [0.25, 0.7499999999995]],
              )
              np.testing.assert_allclose(
                  chain.transition_matrix,
                  [[0.5, 0.5], [0.25, 0.75]],
                  atol=1e-15,
                  rtol=0.0,
              )
              assert np.all(chain.transition_matrix.sum(axis=1) == 1.0)


          def test_markov_chain_preserves_state_labels_and_tolerance():
              chain = MarkovChain(
                  [[1.0, 0.0], [0.0, 1.0]],
                  states=["healthy", "dead"],
                  tolerance=1e-10,
              )
              assert chain.states == ("healthy", "dead")
          PY
      - name: Run focused tests
        run: python -m pytest tests/test_markov_chain_validation.py tests/test_stochastic_markov.py -q
      - name: Commit migration and remove temporary workflow
        run: |
          rm .github/workflows/refactor-markov-validation.yml
          rm -f .phase2_markov_validation_trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add optiflowx/stochastic/markov_chain.py tests/test_markov_chain_validation.py .github/workflows/refactor-markov-validation.yml .phase2_markov_validation_trigger
          git commit -m "refactor: centralize MarkovChain validation"
          git push
