[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "stochx"
dynamic = ["version"]
requires-python = ">=3.10"
description = "An EViews-inspired Python library for time-series analysis, econometrics, and forecasting."
readme = "README.md"
authors = [{ name = "Alikacem Faycal", email = "faycal213.dz@gmail.com" }]
license = { text = "MIT" }
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "statsmodels",
  "matplotlib",
]
keywords = [
  "time series",
  "time-series analysis",
  "econometrics",
  "EViews",
  "ARMA",
  "ARIMA",
  "SARIMA",
  "forecasting",
  "Box-Jenkins",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/Faycal214/stochx"
Documentation = "https://faycal214.github.io/stochx/"
Repository = "https://github.com/Faycal214/stochx"
Issues = "https://github.com/Faycal214/stochx/issues"
Changelog = "https://github.com/Faycal214/stochx/blob/main/CHANGELOG.md"

[project.optional-dependencies]
timeseries = ["arch"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=24.0",
    "ruff>=0.5.0",
    "mypy>=1.5",
    "build",
    "twine",
    "arch",
]

docs = [
    "mkdocs",
    "mkdocs-material",
    "pymdown-extensions",
]

[tool.hatch.version]
path = "stochx/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["stochx"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --maxfail=1"
testpaths = ["tests"]
markers = [
    "parity: numerical regression checks against published EViews outputs",
]

[tool.coverage.run]
branch = true
source = ["stochx"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
strict = true
